   <g id="text_1">
    <text style="fill: #111827; font: 7px 'Arial'" transform="translate(42.097188 49.108422)">MPDD</text>
    <text style="fill: #111827; font: 7px 'Arial'" transform="translate(24.388828 56.762758)">Development only</text>
    <text style="fill: #111827; font: 7px 'Arial'" transform="translate(15.534922 64.499125)">method + weight choice</text>
   </g>
   <g id="text_2">
    <text style="fill: #111827; font: 700 7px 'Arial'" transform="translate(124.183475 49.205219)">Protocol freeze</text>
    <text style="fill: #111827; font: 700 7px 'Arial'" transform="translate(118.148709 56.849711)">A1 fixed at 0.5 / 0.5</text>
    <text style="fill: #111827; font: 700 7px 'Arial'" transform="translate(116.798475 64.494203)">no further selection</text>
   </g>
   <g id="text_3">
    <text style="fill: #111827; font: 7px 'Arial'" transform="translate(219.879294 49.190453)">Frozen validation</text>
    <text style="fill: #111827; font: 7px 'Arial'" transform="translate(218.007341 56.844789)">BTAD · MVTec AD</text>
    <text style="fill: #111827; font: 7px 'Arial'" transform="translate(234.079997 64.499125)">external</text>
   </g>
   <g id="text_4">
    <text style="fill: #111827; font: 7px 'Arial'" transform="translate(319.914744 49.149438)">Frozen validation</text>
    <text style="fill: #111827; font: 7px 'Arial'" transform="translate(339.430525 56.803774)">VisA</text>
    <text style="fill: #111827; font: 7px 'Arial'" transform="translate(301.235134 64.45811)">in-domain checkpoint lineage</text>
   </g>
   <g id="text_5">
    <text style="fill: #111827; font: 7.1px 'Arial'" transform="translate(34.405442 120.474476)">3 seeds × 1/2/4 shots</text>
