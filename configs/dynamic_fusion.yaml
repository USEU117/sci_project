phase: design
development:
  dataset: visa
  allowed_seeds: [0]
  frozen_predictions_only: true
  visual_branch: anomalydino
  text_guided_branch: winclip_plus
final_validation:
  visa_seeds: [1, 2]
  mvtec_seeds: [0, 1, 2]
  locked_until_design_freeze: true
forbidden_router_inputs:
  - ground_truth_mask
  - image_label
  - category_test_label
  - test_set_mean
  - test_set_standard_deviation
router:
  type: confidence
  temperature: 0.20
  min_weight: 0.05
  decision_margin: 0.15
  pixel_level: true
calibration:
  required_before_performance_claim: true
  allowed_sources:
    - source_domain_validation
    - target_normal_reference_shots
  forbidden_sources:
    - target_test_images
    - target_test_labels
    - target_test_masks
  status: not_implemented
outputs:
  - fused_image_score
  - fused_pixel_map
  - visual_weight
  - visual_pixel_weight
  - route_decision
